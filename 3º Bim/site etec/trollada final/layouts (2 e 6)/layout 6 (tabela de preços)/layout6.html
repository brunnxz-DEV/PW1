<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de preços</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<section>
    <h2>TABELA DE PREÇOS</h2>

    <div class="pricing">

        <div class="plano">
            <h3>Plano Básico</h3>

            <p class="preco">R$ 19/mês</p>

            <ul>
                <li>10 projetos</li>
                <li>15 GB de armazenamento</li>
                <li>Suporte por e-mail</li>
            </ul>

            <button>COMEÇAR</button>
        </div>


        <div class="plano destaque">
            <h3>Plano Pro</h3>

            <p class="preco">R$ 69/mês</p>

            <ul>
                <li>30 projetos</li>
                <li>65 GB de armazenamento</li>
                <li>Suporte prioritário</li>
            </ul>

            <button>COMEÇAR</button>
        </div>


        <div class="plano">
            <h3>Enterprise</h3>

            <p class="preco">R$ 219/mês</p>

            <ul>
                <li>Projetos ilimitados</li>
                <li>250 GB de armazenamento</li>
                <li>Suporte 24/7</li>
            </ul>

            <button>CONTATO</button>
        </div>

    </div>
</section>    
</body>
</html>
